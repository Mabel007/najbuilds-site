    <meta name="twitter:image:alt" content="Naj Builds — BUILD • VALIDATE • SHIP" />

    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('naj-theme')
          if (stored === 'light' || stored === 'dark') {
            document.documentElement.dataset.theme = stored
            document.documentElement.style.colorScheme = stored
            const themeColor = document.querySelector('meta[name="theme-color"]')
            if (themeColor) {
              themeColor.setAttribute('content', stored === 'light' ? '#F8F5EF' : '#090A0D')
            }
          }
        } catch {
          /* Storage may be unavailable; the dark-first default remains. */
        }
      })()
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Naj Builds",
        "url": "https://najbuilds.com/",
        "description": "Frontend engineering, quality assurance, technical stories and real-world projects — the practice behind Naj Builds.",
        "inLanguage": "en",
        "publisher": {
          "@type": "Person",
          "name": "Chris",
          "url": "https://najbuilds.com/",
          "sameAs": [
            "https://najbuilds.hashnode.dev/",
            "https://github.com/Mabel007",
            "https://x.com/najbuilds"
          ]
        }
      }
    </script>

          <p style="color: #c9ced6; line-height: 1.7; max-width: 34rem">
            This site needs JavaScript to display. The full portfolio is in development. In the
            meantime, reach out at
            <a href="mailto:contact@najbuilds.com" style="color: #e0ab58">contact@najbuilds.com</a>.
          </p>
        </div>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
